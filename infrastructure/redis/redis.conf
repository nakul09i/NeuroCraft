# NeuroCraft Local Redis Configuration (Phase 0 Scaffold)
bind 127.0.0.1
port 6379
protected-mode yes
timeout 0
tcp-keepalive 300
daemonize no
loglevel notice
databases 16
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data
maxmemory 256mb
maxmemory-policy volatile-lru
