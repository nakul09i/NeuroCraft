[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurocraft"
version = "0.1.0"
description = "Detect. Verify. Prove. — AI-assisted, multi-layer cybersecurity platform for file analysis and cryptographic provenance."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "The NeuroCraft Authors" }
]
keywords = ["cybersecurity", "static-analysis", "malware-detection", "provenance", "merkle-tree", "explainable-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

dependencies = [
    "pydantic>=2.7.0,<3.0.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "pefile>=2023.2.7",
    "cryptography>=42.0.0",
    "pyjwt>=2.8.0",
    "dnspython>=2.6.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
where = [
    "packages/shared-types/src",
    "packages/shared-config/src",
    "packages/shared-security/src",
    "packages/shared-logging/src",
    "packages/api-client/src",
    "services/api/src",
    "services/scanner/src",
    "services/ml-engine/src",
    "services/risk-engine/src",
    "services/quantum-engine/src",
    "services/recon-engine/src",
    "services/explanation-engine/src",
    "services/integrity-service/src",
    "services/provenance-service/src",
    "services/worker/src",
    "apps/cli/src",
]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "build",
    "dist",
    "test-fixtures",
    "datasets",
    "scratch",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "S101", # allow assert in tests
    "S324", # allow md5/sha1 for legacy file fingerprinting metadata
    "S110", # allow try-except-pass in passive parser probing
    "E501", # allow long lines where needed
    "B008", # allow FastAPI Depends/File argument defaults
    "UP042", # allow (str, Enum) for pydantic serialization compatibility
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "E402", "B904"]
"scripts/*" = ["S101", "T201"]
"infrastructure/*" = ["ALL"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
exclude = ["^tests/"]

[[tool.mypy.overrides]]
module = "pefile"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated unit tests",
    "integration: service integration tests",
    "security: security verification tests",
    "robustness: malformed file handling tests",
]
